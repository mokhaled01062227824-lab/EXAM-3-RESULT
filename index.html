<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نتيجة امتحان 3</title>
<style>
*{box-sizing:border-box}
body{
    margin:0;
    min-height:100vh;
    font-family:"Segoe UI",Tahoma,Arial,sans-serif;
    background:linear-gradient(135deg,#eef4ff,#f7f9fc);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    color:#172033;
}
.card{
    width:100%;
    max-width:520px;
    background:#fff;
    border-radius:22px;
    padding:30px;
    box-shadow:0 12px 40px rgba(25,50,90,.12);
}
h1{margin:0 0 8px;text-align:center;font-size:28px}
.subtitle{text-align:center;color:#697386;margin-bottom:25px}
label{display:block;font-weight:700;margin-bottom:8px}
input{
    width:100%;
    padding:15px 16px;
    border:2px solid #e3e8f0;
    border-radius:12px;
    font-size:18px;
    outline:none;
    direction:ltr;
    text-align:center;
}
input:focus{border-color:#3867d6}
button{
    width:100%;
    margin-top:14px;
    padding:15px;
    border:0;
    border-radius:12px;
    background:#3867d6;
    color:white;
    font-size:18px;
    font-weight:700;
    cursor:pointer;
}
button:hover{background:#2f58bd}
.message{text-align:center;margin-top:18px;font-weight:600}
.result{
    margin-top:22px;
    padding:20px;
    border-radius:16px;
    background:#f5f8ff;
    border:1px solid #dfe7fb;
}
.row{display:flex;justify-content:space-between;gap:15px;padding:11px 0;border-bottom:1px solid #e3e8f0}
.row:last-child{border-bottom:0}
.key{font-weight:700;color:#596579}
.value{font-weight:600;text-align:left}
.score{font-size:34px;color:#3867d6}
.hidden{display:none}
.footer{text-align:center;color:#8a94a6;font-size:12px;margin-top:22px}
</style>
</head>

<div class="card">

    <label for="code">الكود</label>
    <input id="code" type="text" inputmode="numeric" autocomplete="off"
           placeholder="اكتب الكود هنا" maxlength="20">
    <button onclick="searchResult()">إظهار النتيجة</button>

    <div id="message" class="message"></div>

    <div id="result" class="result hidden">
        <div class="row">
            <span class="key">الاسم</span>
            <span class="value" id="name"></span>
        </div>
        <div class="row">
            <span class="key">العنوان</span>
            <span class="value" id="address"></span>
        </div>
        <div class="row">
            <span class="key">النتيجة</span>
            <span class="value score" id="score"></span>
        </div>
    </div>

    <div class="footer">نتائج امتحان 3</div>
</div>

function searchResult() {
    const code = document.getElementById("code").value.trim();
    const message = document.getElementById("message");
    const result = document.getElementById("result");

    result.classList.add("hidden");
    message.textContent = "";

    if (!code) {
        message.textContent = "من فضلك اكتب الكود أولاً.";
        message.style.color = "#d64545";
        return;
    }

    const student = students.find(s => s.id === code);

    if (!student) {
        message.textContent = "الكود غير موجود. تأكد من الكود وحاول مرة أخرى.";
        message.style.color = "#d64545";
        return;
    }

    document.getElementById("name").textContent = student.name;
    document.getElementById("address").textContent = student.address;
    document.getElementById("score").textContent = student.result;

    message.textContent = "تم العثور على النتيجة بنجاح";
    message.style.color = "#198754";
    result.classList.remove("hidden");
}

document.getElementById("code").addEventListener("keydown", function(e) {
    if (e.key === "Enter") searchResult();
});
